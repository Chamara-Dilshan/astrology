name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pango / HarfBuzz
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Download Swiss Ephemeris data
        run: |
          mkdir -p ephe
          for f in sepl_18 semo_18 seas_18; do
            curl -fsSL -o ephe/$f.se1 https://raw.githubusercontent.com/aloistr/swisseph/master/ephe/$f.se1
          done

      - name: Selftest (textbook examples)
        run: python jyotisha_calc.py --selftest

      - name: Web app tests
        run: python -m pytest -v

      - name: Report G with visual QA
        run: >
          python jyotisha_report.py --report G --name Test --date 1990-05-15 --time 10:30
          --lat 6.93 --lon 79.85 --place Colombo --out test_G.pdf --qa

      - name: Report A1 with visual QA
        run: >
          python jyotisha_report.py --report A1 --name Test --date 1990-05-15 --time 10:30
          --lat 6.93 --lon 79.85 --place Colombo --brand "Jyothisha Insight" --out test_A1.pdf --qa

      - name: Social graphics (post 14 must blur the birth data)
        run: |
          python jyotisha_gfx.py --out gfx --report test_A1.pdf
          python -c "import pymupdf, jyotisha_gfx as g; v = g._personal_values(pymupdf.open('test_A1.pdf')); print(sorted(v)); assert {'Test', '1990-05-15', '10:30', 'Colombo', '6.9300', '79.8500'} <= v"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            test_*.pdf
            test_*_qa/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t jyotisha .

      - name: Selftest in container
        run: docker run --rm jyotisha selftest

      - name: Report A1 with visual QA in container
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm -v "$PWD/out:/out" jyotisha report --report A1 --name Test --date 1990-05-15 \
            --time 10:30 --lat 6.93 --lon 79.85 --place Colombo --out /out/test_A1.pdf --qa

      - name: Web app smoke test
        run: |
          docker run -d --name web -p 8000:8000 jyotisha
          for i in $(seq 30); do curl -fs localhost:8000/healthz && break; sleep 1; done
          curl -fs localhost:8000/ | grep -q "Jyothisha Insight"
          curl -fs -o g.pdf -F name=Test -F birth_date=1990-05-15 -F birth_time=10:30 \
            -F lat=6.93 -F lon=79.85 -F report=G localhost:8000/report
          head -c 5 g.pdf | grep -q "%PDF-"
          test "$(curl -s -o /dev/null -w '%{http_code}' -F name=X -F birth_date=1990-05-15 \
            -F birth_time=25:00 -F lat=6.9 -F lon=79.8 localhost:8000/report)" = 400
