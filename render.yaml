# Render blueprint: New > Blueprint > pick this repo. Builds the Dockerfile and runs the web app.
services:
  - type: web
    name: jyotisha-insight
    runtime: docker
    plan: free
    region: singapore   # closest Render region to Sri Lanka
    autoDeploy: true    # redeploy on every push to main
    healthCheckPath: /healthz
    envVars:
      - key: MAX_PARALLEL
        value: "1"
      # Report types, the PDF contact line and the order button use the defaults in web/app.py
      # (all four reports; the Jyothisha Insight Facebook page). Override with WEB_REPORTS,
      # BRAND_CONTACT, ORDER_URL in the Render dashboard if needed.
