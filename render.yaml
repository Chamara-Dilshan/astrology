# Render blueprint: New > Blueprint > pick this repo. Builds the Dockerfile and runs the web app.
services:
  - type: web
    name: jyotisha-insight
    runtime: docker
    plan: free
    region: singapore   # closest Render region to Sri Lanka
    autoDeploy: true    # redeploy on every push to main
    healthCheckPath: /healthz
    envVars:
      - key: MAX_PARALLEL
        value: "1"
