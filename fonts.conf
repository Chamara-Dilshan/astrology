<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fontconfig for WeasyPrint/GTK on Windows: GTK's default config plus ./fonts.
     Needed because the script's file://D:\... @font-face URLs don't resolve on Windows,
     so the Noto fonts must be findable by family name. Use via FONTCONFIG_FILE.
     Libraries come from MSYS2 ucrt64 (WEASYPRINT_DLL_DIRECTORIES=C:\msys64\ucrt64\bin). -->
<fontconfig>
  <include ignore_missing="yes">C:/msys64/ucrt64/etc/fonts/fonts.conf</include>
  <dir>D:/Projects/Astrology/fonts</dir>
</fontconfig>
